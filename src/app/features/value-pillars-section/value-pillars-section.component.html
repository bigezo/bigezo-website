<section id="services" class="border-b border-white/10 py-14 text-white sm:py-20">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <bigezo-section-heading
      scriptTitle="Where we add Value"
      headingTitle="Custom Software Solutions For Serious Business Needs"
      tone="dark"
    />

    <div class="mt-10 grid gap-4 sm:mt-12 sm:gap-5 md:grid-cols-2">
      @for (pillar of pillars; track pillar.id) {
        <article class="bigezo-tile flex min-w-0 items-start gap-4 p-5 sm:gap-5 sm:p-6">
          <div
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-[#E48735]/15 text-[#FFA954]"
            aria-hidden="true"
          >
            <i [class]="pillar.iconClass + ' text-xl'"></i>
          </div>
          <div class="min-w-0">
            <h3 class="font-heading break-words text-xl font-bold tracking-tight text-white sm:text-2xl">
              {{ pillar.title }}
            </h3>
            <p class="font-body mt-1.5 text-sm leading-relaxed text-[#D4DEEC] sm:text-base">
              {{ pillar.description }}
            </p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
