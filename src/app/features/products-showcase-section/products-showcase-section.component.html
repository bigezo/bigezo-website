<section id="products" class="border-b border-white/10 py-14 text-white sm:py-20">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <bigezo-section-heading
      scriptTitle="Our Products"
      headingTitle="Advanced Apps & Digital Products"
      align="center"
      tone="dark"
    />

    <div class="mt-10 grid grid-cols-1 gap-5 sm:mt-12 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5">
      @for (product of products; track product.id) {
        <bigezo-product-card
          [product]="product"
          (selected)="handleProductSelect($event)"
        />
      }
    </div>
  </div>
</section>
