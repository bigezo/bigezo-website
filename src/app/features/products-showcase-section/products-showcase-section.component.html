<section id="products" class="border-b border-[#45260B]/15 bg-white py-16 sm:py-20 text-black">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <bigezo-section-heading
      scriptTitle="Our Products"
      headingTitle="Advanced Apps & Digital Products"
      align="center"
      tone="light"
    />

    <div class="mt-12 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      @for (product of products; track product.id) {
        <bigezo-product-card
          [product]="product"
          (selected)="handleProductSelect($event)"
        />
      }
    </div>
  </div>
</section>
