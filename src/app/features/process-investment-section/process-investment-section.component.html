<section id="process" class="bg-white py-16 sm:py-20 text-black">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid items-center gap-10 lg:grid-cols-12 lg:gap-12">
      <div class="min-w-0 space-y-8 lg:col-span-6">
        <div class="flex items-baseline gap-3 sm:gap-4">
          <span class="font-heading shrink-0 text-6xl sm:text-8xl leading-none text-[#E68836]">5</span>
          <bigezo-section-heading
            scriptTitle="Easy Steps"
            headingTitle="Structured Engagement Process"
            tone="light"
          />
        </div>

        <ol class="space-y-4 border-l-4 border-[#45260B] pl-6">
          @for (step of steps; track step.stepNumber) {
            <li class="flex items-center gap-4">
              <span
                class="font-heading flex h-9 w-9 shrink-0 items-center justify-center bg-[#45260B] text-xl text-[#E68836]"
              >
                {{ step.stepNumber }}
              </span>
              <span class="font-body text-lg font-medium text-black">
                {{ step.title }}
              </span>
            </li>
          }
        </ol>

        <div class="border-2 border-[#45260B] bg-[#45260B] p-6 sm:p-8 text-white">
          <p class="font-heading text-lg tracking-widest text-white/80 uppercase">
            Project Investment
          </p>
          <p class="font-heading mt-1 text-4xl sm:text-5xl tracking-wide text-[#E68836]">
            UGX 5M – 50M+
          </p>
          <p class="font-body mt-2 text-sm sm:text-base text-white/90">
            Price Depends on Scope and Complexity. Final quotation is issued after technical
            assessment and scope definition.
          </p>

          <div
            class="mt-6 flex flex-wrap items-center gap-6 border-t border-white/15 pt-5 font-heading text-xl tracking-wider text-[#E68836] uppercase"
          >
            <span class="flex items-center gap-2">
              <i class="fa-solid fa-mobile-screen-button text-base" aria-hidden="true"></i>
              Advanced Mobile Apps
            </span>
            <span class="flex items-center gap-2">
              <i class="fa-solid fa-desktop text-base" aria-hidden="true"></i>
              Advanced Websites
            </span>
          </div>
        </div>
      </div>

      <div class="min-w-0 lg:col-span-6">
        <div class="border-2 border-[#45260B]/15 bg-white p-3">
          <picture>
            <source srcset="images/cloud-architecture-network.webp" type="image/webp" />
            <img
              src="images/cloud-architecture-network.jpg"
              alt="Bigezo Technologies scalable cloud, API, and database architecture"
              width="1200"
              height="800"
              loading="lazy"
              decoding="async"
              class="h-auto w-full object-contain"
            />
          </picture>
        </div>
      </div>
    </div>
  </div>
</section>
