<section id="expertise" class="bg-[#45260B] py-16 sm:py-20 text-white">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <bigezo-section-heading
      scriptTitle="Our Expertise"
      headingTitle="Core Technical Capabilities"
      tone="dark"
    />

    <div class="mt-12 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (item of expertiseItems; track item.id) {
        <article
          class="flex min-w-0 flex-col justify-between border border-white/15 bg-black/25 p-5 sm:p-6 transition-colors duration-200 hover:border-[#E68836]"
        >
          <div class="min-w-0">
            <div class="mb-4 flex items-center gap-3">
              <span
                class="flex h-10 w-10 shrink-0 items-center justify-center bg-[#E68836] text-[#45260B]"
                aria-hidden="true"
              >
                <i [class]="item.iconClass + ' text-lg'"></i>
              </span>
              <i class="fa-solid fa-chevron-right text-xs text-[#E68836]" aria-hidden="true"></i>
            </div>
            <h3 class="font-heading break-words text-2xl uppercase tracking-wide text-[#E68836]">
              {{ item.title }}
            </h3>
            <p class="font-body mt-2 text-base leading-relaxed text-white/90">
              {{ item.description }}
            </p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
