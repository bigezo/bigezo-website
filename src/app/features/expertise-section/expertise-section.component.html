<section id="expertise" class="border-b border-white/10 bg-[#0F141D]/55 py-14 text-white sm:py-20">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <bigezo-section-heading
      scriptTitle="Our Expertise"
      headingTitle="Core Technical Capabilities"
      tone="dark"
    />

    <div class="mt-10 grid gap-5 sm:mt-12 md:grid-cols-2 lg:grid-cols-3">
      @for (item of expertiseItems; track item.id) {
        <article class="bigezo-glass-card flex min-w-0 flex-col justify-between p-5 transition-transform duration-200 hover:-translate-y-0.5 sm:p-6">
          <div class="min-w-0">
            <div class="mb-4 flex items-center justify-between">
              <span
                class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-[#E48735]/15 text-[#FFA954]"
                aria-hidden="true"
              >
                <i [class]="item.iconClass + ' text-lg'"></i>
              </span>
              <i class="fa-solid fa-chevron-right text-xs text-[#FFA954]/60" aria-hidden="true"></i>
            </div>
            <h3 class="font-heading break-words text-xl font-bold tracking-tight text-white sm:text-2xl">
              {{ item.title }}
            </h3>
            <p class="font-body mt-2 text-sm leading-relaxed text-[#D4DEEC] sm:text-base">
              {{ item.description }}
            </p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
