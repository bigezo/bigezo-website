<header class="sticky top-0 z-50 border-b border-white/10 bg-[#080B10]/85 text-white backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8">
    <a
      href="#top"
      class="flex min-w-0 items-center gap-3 focus-visible:outline-none"
      aria-label="Bigezo Technologies Home"
      (click)="closeMobileMenu()"
    >
      <img
        src="images/bigezo-logo.png"
        alt="Bigezo Technologies Logo"
        width="560"
        height="269"
        class="h-9 w-auto shrink-0 sm:h-10"
      />
      <div class="min-w-0 border-l border-white/15 pl-3 leading-none">
        <span class="font-heading flex items-center gap-2 truncate text-base font-bold tracking-tight text-white sm:text-lg">
          <span class="bigezo-pulse-dot inline-block h-2 w-2 shrink-0 rounded-full bg-[#F69139]" aria-hidden="true"></span>
          <span class="truncate">BIGEZO TECHNOLOGIES</span>
        </span>
        <span class="font-mono-tech mt-1 block text-[10px] tracking-[0.14em] text-[#FFA954] uppercase">
          ...built to last
        </span>
      </div>
    </a>

    <nav class="hidden items-center gap-6 lg:flex" aria-label="Primary Navigation">
      @for (link of navLinks; track link.fragment) {
        <a
          [href]="'#' + link.fragment"
          class="font-body text-sm font-medium text-[#D4DEEC] transition-colors hover:text-[#FFA954]"
        >
          {{ link.label }}
        </a>
      }
      <a
        href="#contact"
        class="bigezo-btn-primary font-body inline-flex items-center gap-2 px-4 py-2.5 text-sm font-semibold"
      >
        <span>Discuss Your Project</span>
        <i class="fa-solid fa-arrow-right text-xs" aria-hidden="true"></i>
      </a>
    </nav>

    <button
      type="button"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-white/15 bg-white/[0.04] text-white transition-colors hover:border-[#F69139]/60 hover:text-[#FFA954] lg:hidden"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="mobile-primary-nav"
      aria-label="Toggle navigation menu"
    >
      <i
        [class]="mobileMenuOpen() ? 'fa-solid fa-xmark text-lg' : 'fa-solid fa-bars text-lg'"
        aria-hidden="true"
      ></i>
    </button>
  </div>

  @if (mobileMenuOpen()) {
    <nav
      id="mobile-primary-nav"
      class="border-t border-white/10 bg-[#0F1622]/95 px-4 pb-6 pt-4 backdrop-blur-lg lg:hidden"
      aria-label="Mobile Navigation"
    >
      <div class="flex flex-col space-y-2">
        @for (link of navLinks; track link.fragment) {
          <a
            [href]="'#' + link.fragment"
            (click)="closeMobileMenu()"
            class="font-body rounded-lg px-3 py-2.5 text-base font-medium text-[#D4DEEC] transition-colors hover:bg-white/[0.05] hover:text-[#FFA954]"
          >
            {{ link.label }}
          </a>
        }
        <a
          href="#contact"
          (click)="closeMobileMenu()"
          class="bigezo-btn-primary font-body mt-2 inline-flex items-center justify-center gap-2 px-5 py-3 text-base font-semibold"
        >
          <span>Discuss Your Project</span>
          <i class="fa-solid fa-arrow-right text-xs" aria-hidden="true"></i>
        </a>
      </div>
    </nav>
  }
</header>
