<header class="sticky top-0 z-50 border-b border-white/10 bg-[#45260B] text-white">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8">
    <a
      href="#top"
      class="flex min-w-0 items-center gap-3 focus-visible:outline-none"
      aria-label="Bigezo Technologies Home"
      (click)="closeMobileMenu()"
    >
      <img
        src="images/bigezo-logo.png"
        alt="Bigezo Technologies Logo"
        width="560"
        height="269"
        class="h-10 w-auto shrink-0 sm:h-11"
      />
      <div class="min-w-0 border-l border-white/20 pl-3 leading-none">
        <span class="font-heading block truncate text-lg tracking-wider text-white sm:text-xl">
          BIGEZO TECHNOLOGIES
        </span>
        <span class="font-body block text-[11px] tracking-[0.18em] text-[#E68836]">
          ...built to last
        </span>
      </div>
    </a>

    <nav class="hidden items-center gap-6 lg:flex" aria-label="Primary Navigation">
      @for (link of navLinks; track link.fragment) {
        <a
          [href]="'#' + link.fragment"
          class="font-body text-sm font-medium tracking-wide text-white/90 transition-colors hover:text-[#E68836]"
        >
          {{ link.label }}
        </a>
      }
      <a
        href="#contact"
        class="font-heading bg-[#E68836] px-5 py-2.5 text-lg tracking-wider text-black transition-colors hover:bg-white hover:text-[#45260B]"
      >
        Discuss Your Project
      </a>
    </nav>

    <button
      type="button"
      class="flex h-10 w-10 shrink-0 items-center justify-center border border-white/25 text-white transition-colors hover:border-[#E68836] hover:text-[#E68836] lg:hidden"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="mobile-primary-nav"
      aria-label="Toggle navigation menu"
    >
      <i
        [class]="mobileMenuOpen() ? 'fa-solid fa-xmark text-lg' : 'fa-solid fa-bars text-lg'"
        aria-hidden="true"
      ></i>
    </button>
  </div>

  @if (mobileMenuOpen()) {
    <nav
      id="mobile-primary-nav"
      class="border-t border-white/10 bg-[#45260B] px-4 pb-6 pt-4 lg:hidden"
      aria-label="Mobile Navigation"
    >
      <div class="flex flex-col space-y-3">
        @for (link of navLinks; track link.fragment) {
          <a
            [href]="'#' + link.fragment"
            (click)="closeMobileMenu()"
            class="font-body border-b border-white/10 pb-2 text-base font-medium text-white transition-colors hover:text-[#E68836]"
          >
            {{ link.label }}
          </a>
        }
        <a
          href="#contact"
          (click)="closeMobileMenu()"
          class="font-heading mt-2 inline-block bg-[#E68836] px-5 py-3 text-center text-xl tracking-wider text-black transition-colors hover:bg-white"
        >
          Discuss Your Project
        </a>
      </div>
    </nav>
  }
</header>
