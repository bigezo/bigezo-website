<button
  type="button"
  (click)="onSelect()"
  class="product-card bigezo-glass-card group relative flex h-full w-full min-w-0 cursor-pointer flex-col items-center justify-center px-6 py-9 text-center transition-all duration-200 hover:-translate-y-1 hover:border-[#F69139]/60 focus-visible:border-[#F69139]"
  [attr.aria-label]="'View details for ' + product().name"
>
  <span
    class="absolute top-3.5 right-3.5 text-xs text-[#A6B4C8] transition-colors duration-200 group-hover:text-[#FFA954]"
    aria-hidden="true"
  >
    @if (product().url) {
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
    } @else {
      <i class="fa-solid fa-circle-info"></i>
    }
  </span>

  <div
    class="mb-5 flex h-20 w-20 items-center justify-center rounded-2xl bg-[#E48735]/15 text-[#FFA954] transition-all duration-200 group-hover:bg-gradient-to-br group-hover:from-[#F69139] group-hover:to-[#C76B1B] group-hover:text-white group-hover:shadow-lg group-hover:shadow-[#E48735]/30"
    aria-hidden="true"
  >
    <i [class]="product().iconClass + ' text-4xl'"></i>
  </div>

  <h3
    class="font-heading text-2xl font-bold tracking-tight text-white transition-colors duration-200 group-hover:text-[#FFA954] sm:text-3xl"
  >
    {{ product().name }}
  </h3>
</button>
