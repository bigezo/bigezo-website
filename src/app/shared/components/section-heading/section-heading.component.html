<div
  class="min-w-0 space-y-2.5"
  [class.text-center]="align() === 'center'"
  [class.mx-auto]="align() === 'center'"
  [class.max-w-3xl]="align() === 'center'"
>
  @if (headingTitle()) {
    <p class="font-mono-tech break-words text-xs sm:text-sm uppercase tracking-[0.14em] font-medium text-[#FFA954]">
      // {{ headingTitle() }}
    </p>
  }

  @if (scriptTitle()) {
    <h2 class="font-heading break-words text-3xl sm:text-4xl md:text-5xl leading-[1.1] font-bold tracking-tight text-white">
      {{ scriptTitle() }}
    </h2>
  }

  @if (subtitle()) {
    <p class="font-body text-base sm:text-lg leading-relaxed pt-1.5 text-[#D4DEEC]">
      {{ subtitle() }}
    </p>
  }
</div>
